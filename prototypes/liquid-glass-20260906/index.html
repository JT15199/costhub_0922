<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CostHub · 流光玻璃</title><link rel="stylesheet" href="style.css"></head>
<body>
<aside class="sidebar glass"><a class="brand" href="#dashboard" aria-label="CostHub 今日工作台"><span class="crystal" aria-hidden="true"><i></i><b></b><em></em></span><span>CostHub<small>成本管理平台</small></span></a><nav aria-label="主导航">
<button data-page="dashboard" class="nav active"><span data-icon="chart"></span><span>今日工作台</span></button><button data-page="projects" class="nav"><span data-icon="project"></span><span>项目</span></button><button data-page="intelligence" class="nav"><span data-icon="branch"></span><span>情报</span></button><button data-page="library" class="nav"><span data-icon="grid"></span><span>资料库</span></button><button data-page="journal" class="nav"><span data-icon="book"></span><span>工作手账</span><i class="nav-dot"></i></button></nav><div class="sidebar-context"><span class="eyebrow">继续工作</span><button data-project="M27-Q"><span class="project-dot"></span><span>M27-Q<small>PDCP · 方案收敛</small></span><span data-icon="arrow"></span></button></div><div class="sidebar-bottom"><button data-dialog="ai"><span data-icon="spark"></span> AI 情报</button><div class="account"><span class="avatar">A</span><span>admin<small>本地工作空间</small></span><button class="icon-button" data-dialog="settings" aria-label="外观与动效"><span data-icon="settings"></span></button></div></div></aside>
<div class="workspace"><header class="topbar"><button class="global-search glass" data-dialog="search" aria-label="搜索工作空间"><span data-icon="search"></span><span>搜索项目、供应商、文件…</span><kbd>Ctrl K</kbd></button><div class="top-actions"><span class="status"><i></i>本地 AI <small>演示状态</small></span><button class="icon-button" data-dialog="activity" aria-label="最近动态"><span data-icon="bell"></span></button><button class="button primary" data-dialog="ai"><span data-icon="play"></span>开始分析</button></div></header>
<main id="main"></main><footer class="app-footer"><span><i></i>流光玻璃 · 交互设计预览 · 全部为示例数据</span><button data-dialog="about">预览说明 <span data-icon="info"></span></button></footer></div>
<dialog id="drawer" class="drawer glass" aria-labelledby="drawer-title"><header><span class="eyebrow">COSTHUB / 工作空间</span><button class="icon-button" data-close="drawer" aria-label="关闭侧栏"><span data-icon="close"></span></button></header><h2 id="drawer-title"></h2><div id="drawer-body"></div></dialog>
<dialog id="reader" class="reader" aria-labelledby="reader-name"><div class="reader-toolbar"><div><span class="eyebrow">工作手账 / 册页阅读</span><h2 id="reader-name"></h2></div><div><button class="button" id="reader-edit"><span data-icon="edit"></span>编辑记录</button><button class="icon-button" data-close="reader" aria-label="合上手账"><span data-icon="close"></span></button></div></div><div class="open-book"><aside class="left-leaf"><div class="leaf-top"><span id="book-code"></span><span>目录</span></div><h3 id="book-subtitle"></h3><p class="muted">每一次判断，都有来路。</p><div id="contents"></div><div class="leaf-footer">CostHub · 工作记录</div></aside><article class="right-leaf" id="right-leaf"><div id="entry"></div></article><span class="binding" aria-hidden="true"></span><div class="opening-cover" aria-hidden="true"><span>CostHub</span><strong>工作手账</strong></div></div><footer class="reader-controls"><span id="page-count" aria-live="polite"></span><div><button class="button" id="prev-entry"><span data-icon="left"></span>上一页</button><button class="button" id="next-entry">下一页<span data-icon="arrow"></span></button></div><span class="muted">方向键翻阅 · Esc 合上</span></footer></dialog>
<dialog id="editor" class="editor glass" aria-labelledby="editor-title"><form id="note-form"><header><h2 id="editor-title">写一条手账</h2><button type="button" class="icon-button" data-close="editor" aria-label="关闭编辑器"><span data-icon="close"></span></button></header><label>标题<input id="note-title" required maxlength="80" placeholder="记录一个进展或判断"></label><div class="form-row"><label>手账<select id="note-book"><option value="0">M27-Q · 方案收敛</option><option value="1">G32-U · 规格探索</option><option value="2">工作备忘 · 随手记</option></select></label><label>类型<select id="note-type"><option>决策记录</option><option>工作进展</option><option>待跟进</option><option>心得</option></select></label></div><label>记录<textarea id="note-content" required rows="5"></textarea></label><label>下一步<input id="note-next" placeholder="接下来需要做什么"></label><footer><small>仅保存在本次预览，刷新恢复示例</small><button type="submit" class="button primary">保存记录</button></footer></form></dialog>
<div class="toast glass" id="toast" role="status" hidden></div><script src="app.js"></script></body></html>
