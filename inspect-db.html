<!DOCTYPE html>
<html>
<head>
    <title>Database Inspector</title>
    <script type="module">
        import Database from '@tauri-apps/plugin-sql';

        async function inspectDatabase() {
            try {
                const db = await Database.load('sqlite:database.db');

                // 获取所有表名
                const tables = await db.select(
                    "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"
                );

                console.log('Tables:', tables);
                document.getElementById('output').innerHTML = '<h2>Tables:</h2><pre>' +
                    JSON.stringify(tables, null, 2) + '</pre>';

                // 获取每个表的结构
                for (const table of tables) {
                    const schema = await db.select(`PRAGMA table_info(${table.name})`);
                    console.log(`Schema for ${table.name}:`, schema);
                    document.getElementById('output').innerHTML +=
                        `<h3>${table.name}</h3><pre>` +
                        JSON.stringify(schema, null, 2) + '</pre>';
                }
            } catch (err) {
                console.error('Error:', err);
                document.getElementById('output').innerHTML =
                    '<p style="color:red">Error: ' + err.message + '</p>';
            }
        }

        window.addEventListener('DOMContentLoaded', inspectDatabase);
    </script>
</head>
<body>
    <h1>Database Structure</h1>
    <div id="output">Loading...</div>
</body>
</html>
