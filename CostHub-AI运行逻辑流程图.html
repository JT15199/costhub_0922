<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CostHub 运行逻辑 · AI 能力总览</title>
<style>
  /* 设计原则（参考 paper-framework-figure-studio-pro）：
     · 视觉主线：一条从启动到呈现的主线，一眼看懂
     · 密度平衡：节点只留标题+一句话；长文收进可展开详情
     · 连线优先：频率/边界类信息放连线标签（edge label），不放盒子
     · 模块化：每个 AI 能力是一个卡片，不是碎块列表
     · 克制配色：单主色 + 语义色，灰阶可读 */
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;background:#eef2f7;color:#0f172a;line-height:1.5}
  .wrap{max-width:1060px;margin:0 auto;padding:20px 16px 56px}

  /* 顶栏 */
  .top{background:#0f172a;color:#fff;border-radius:14px;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
  .top h1{font-size:19px;letter-spacing:.3px}
  .top .meta{font-size:12px;opacity:.75;margin-top:2px}
  .top button{background:#fff;color:#0f172a;border:none;border-radius:9px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer}
  .top .ver{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:1px 10px;font-size:12.5px;margin-left:8px;font-weight:600}

  /* 图例 */
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 2px;font-size:12px}
  .lg{background:#fff;border:1px solid #e2e8f0;border-radius:999px;padding:3px 11px;display:inline-flex;gap:6px;align-items:center;color:#475569}
  .lg i{width:9px;height:9px;border-radius:2px;display:inline-block}

  /* 章节 */
  .sec{margin-top:30px}
  .sec-title{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
  .sec-no{font-size:11px;font-weight:800;color:#fff;background:#334155;border-radius:7px;padding:2px 9px;letter-spacing:1px}
  .sec-title h2{font-size:16.5px;font-weight:700}
  .sec-title p{font-size:12px;color:#64748b}

  /* 主线 */
  .node{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:11px 16px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
  .node .no{font-size:11px;font-weight:800;color:#64748b;border:1px solid #cbd5e1;border-radius:6px;padding:1px 7px;background:#f8fafc;letter-spacing:.5px}
  .node .icon{font-size:21px;line-height:1}
  .node .t{font-size:15px;font-weight:700}
  .node .c{font-size:12px;color:#64748b;margin-top:1px}
  .node.decision{border-color:#f59e0b;background:linear-gradient(90deg,#fffbeb,#fff 45%)}
  .node .fail{margin-left:auto;border:1px dashed #f59e0b;background:#fffbeb;border-radius:9px;padding:4px 11px;font-size:12px;color:#92400e;white-space:nowrap}
  .node .fail b{color:#b45309}
  .node .note{margin-left:auto;border:1px dashed #94a3b8;background:#f8fafc;border-radius:9px;padding:4px 11px;font-size:12px;color:#475569;white-space:nowrap}
  .conn{display:flex;flex-direction:column;align-items:center;padding:1px 0}
  .edge-label{font-size:11px;background:#f1f5f9;border:1px solid #e2e8f0;color:#475569;border-radius:999px;padding:0 11px;margin-top:1px}

  /* 引擎卡片 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
  .engine{background:#fff;border:1px solid #e2e8f0;border-top:3px solid var(--pc,#334155);border-radius:12px;padding:11px 14px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
  .engine summary{list-style:none;cursor:pointer;display:flex;gap:11px;align-items:center;user-select:none}
  .engine summary::-webkit-details-marker{display:none}
  .engine .eicon{font-size:20px}
  .engine .ename{font-size:14px;font-weight:700}
  .engine .etag{font-size:11.5px;color:#64748b;margin-top:1px}
  .engine .more{margin-left:auto;font-size:11px;color:#94a3b8;transition:transform .15s}
  .engine[open] .more{transform:rotate(180deg)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .chip{font-size:11.5px;font-weight:600;background:var(--bg);border:1px solid var(--bd);border-left:3px solid var(--c);border-radius:8px;padding:2px 9px;color:#334155}
  .dbody{margin-top:10px;border-top:1px dashed #e2e8f0;padding-top:9px;display:flex;flex-direction:column;gap:7px}
  .dstep{display:flex;gap:8px;font-size:12.5px;color:#334155}
  .dstep .dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
  .dstep b{color:#0f172a}
  .out{margin-top:4px;font-size:12px;color:#1d4ed8;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:5px 10px}

  /* 双通道 */
  .chans{display:grid;grid-template-columns:1fr minmax(200px,260px) 1fr;gap:12px;align-items:stretch}
  .chan{background:#fff;border:2px solid;border-radius:12px;padding:13px 16px}
  .chan h4{font-size:13.5px;margin-bottom:7px}
  .chan.local{border-color:#93c5fd;background:#f5f9ff}
  .chan.local h4{color:#1d4ed8}
  .chan.cloud{border-color:#fca5a5;background:#fef6f6}
  .chan.cloud h4{color:#b91c1c}
  .chan li{font-size:12.5px;color:#334155;margin-left:16px;margin-top:3px}
  .wall{background:#0f172a;color:#e2e8f0;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;justify-content:center;gap:6px}
  .wall .wt{font-size:13px;font-weight:800;color:#fbbf24}
  .wall .wc{font-size:12px;line-height:1.6}

  /* 标签行（数据/呈现） */
  .tagrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:11px 14px;margin-bottom:10px}
  .tagrow .lbl{font-size:11px;font-weight:800;color:#fff;background:#64748b;border-radius:6px;padding:2px 8px;letter-spacing:1px}
  .tag{font-size:12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:3px 10px;color:#334155;cursor:help}
  .tag:hover{border-color:#94a3b8;background:#f1f5f9}

  /* 日志与指南 */
  .log{border-top:1px solid #e2e8f0;padding-top:6px;display:flex;flex-direction:column;gap:6px}
  .log-item{display:flex;gap:12px;font-size:12.5px;color:#475569}
  .log-item .date{font-weight:700;color:#1d4ed8;white-space:nowrap}
  details.block{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:11px 16px;margin-top:10px}
  details.block summary{list-style:none;cursor:pointer;font-size:14px;font-weight:700;user-select:none;display:flex;justify-content:space-between;align-items:center}
  details.block summary::-webkit-details-marker{display:none}
  details.block .more{font-size:11px;color:#94a3b8}
  details.block[open] .more{transform:rotate(180deg)}
  details.block .inner{margin-top:10px;border-top:1px dashed #e2e8f0;padding-top:10px;font-size:13px;color:#334155}
  details.block ol{padding-left:20px}
  details.block li{margin-top:4px}
  details.block code{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:5px;padding:0 5px;font-size:12px}
  footer{margin-top:28px;text-align:center;font-size:11.5px;color:#94a3b8}

  @media (max-width:860px){ .chans{grid-template-columns:1fr} .grid{grid-template-columns:1fr} }
  @media print{
    body{background:#fff}
    .no-print{display:none !important}
    .node,.engine,.chan,.tagrow,details.block{break-inside:avoid;box-shadow:none}
    .top{background:#0f172a !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>

    <div>
      <h1>CostHub 运行逻辑 · AI 能力总览<span class="ver" id="hdr-ver">v2.3.19</span></h1>

    </div>
    <button class="no-print" onclick="window.print()">🖨 打印 / PDF</button>

  ],

  changelog: [
    { date:'2026-08-16', text:'Agent工作台（13工具） · 学习引擎 · 关键物料洞察+机会点建议 · AI工作台（状态条/速览/活动记录） · 驾驶舱清爽化' },
    { date:'2026-08-15', text:'本地-云端桥（三步+脱敏审计） · 受限模式提示条' },
    { date:'2026-08-14', text:'自主分析引擎 · AI嵌入工作流（体检/解释/问询/趋势小结）' },
    { date:'2026-08-12', text:'报价比对三层流程 · 后台识别引擎 · SKU变体 · 低特效模式' },
  ],
};

/* ═══════════ 渲染层（一般无需修改） ═══════════ */
const KIND = {
  local:{ label:'本地 AI', color:'#1d4ed8', bg:'#eff6ff', bd:'#bfdbfe' },
  cloud:{ label:'云端',    color:'#dc2626', bg:'#fef2f2', bd:'#fecaca' },
  rule: { label:'本地规则', color:'#15803d', bg:'#f0fdf4', bd:'#bbf7d0' },
  gate: { label:'闸门/事件',color:'#b45309', bg:'#fffbeb', bd:'#fde68a' },
  data: { label:'数据',    color:'#64748b', bg:'#f8fafc', bd:'#e2e8f0' },
  ui:   { label:'呈现',    color:'#6d28d9', bg:'#f5f3ff', bd:'#ddd6fe' },
};
const kindOf = k => KIND[k] || KIND.data;
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function el(tag, cls, html){ const d=document.createElement(tag); if(cls)d.className=cls; if(html!=null)d.innerHTML=html; return d; }
const ARROW = '<svg width="14" height="22" viewBox="0 0 14 22" aria-hidden="true"><line x1="7" y1="0" x2="7" y2="17" stroke="#94a3b8" stroke-width="2"/><polyline points="2.5,12.5 7,18.5 11.5,12.5" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function buildMainline(){
  const wrap = el('div');
  FLOWDATA.mainline.forEach((n, i) => {
    const node = el('div','node' + (n.kind==='decision' ? ' decision' : ''));
    let html = '<span class="no">'+esc(n.no)+'</span><span class="icon">'+n.icon+'</span>'
      + '<div><div class="t">'+esc(n.title)+'</div><div class="c">'+esc(n.cap)+'</div></div>';
    if (n.fail) html += '<span class="fail"><span>✗ 失败</span> → <b>'+esc(n.fail.title)+'</b>：'+esc(n.fail.cap)+'</span>';
    if (n.note) html += '<span class="note">'+esc(n.note)+'</span>';
    node.innerHTML = html;
    wrap.appendChild(node);
    if (i < FLOWDATA.mainline.length - 1) {
      const conn = el('div','conn', ARROW + (n.edge ? '<span class="edge-label">'+esc(n.edge)+'</span>' : ''));
      wrap.appendChild(conn);
    }
  });
  return wrap;
}

function buildEngines(){
  const grid = el('div','grid');
  FLOWDATA.engines.forEach(e => {
    const det = el('details','engine');
    det.style.setProperty('--pc', e.pc || '#334155');
    const chips = e.steps.map(s => { const k = kindOf(s.k);
      return '<span class="chip" style="--c:'+k.color+';--bg:'+k.bg+';--bd:'+k.bd+'">'+esc(s.t)+'</span>'; }).join('');
    const body = e.steps.map(s => { const k = kindOf(s.k);
      return '<div class="dstep"><span class="dot" style="background:'+k.color+'"></span><div><b>'+esc(s.t)+'</b> · '+esc(s.d)+'</div></div>'; }).join('');
    det.innerHTML = '<summary><span class="eicon">'+e.icon+'</span><div><div class="ename">'+esc(e.name)+'</div>'
      + '<div class="etag">'+esc(e.tag)+'</div></div><span class="more">▾</span></summary>'
      + '<div class="chips">'+chips+'</div>'
      + '<div class="dbody">'+body+'<div class="out">产出：'+esc(e.out)+'</div></div>';
    grid.appendChild(det);
  });
  return grid;
}

function buildChannels(){
  const wrap = el('div','chans');
  const mk = (key, c) => el('div','chan '+key, '<h4>'+esc(c.title)+'</h4><ul>'+c.items.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul>');
  wrap.appendChild(mk('local', FLOWDATA.channels.local));
  wrap.appendChild(el('div','wall','<div class="wt">⛔ 脱敏铁律</div><div class="wc">'+esc(FLOWDATA.channels.wall)+'</div>'));
  wrap.appendChild(mk('cloud', FLOWDATA.channels.cloud));
  return wrap;
}

function buildStorage(){
  const wrap = el('div');
  const row = (lbl, arr) => el('div','tagrow','<span class="lbl">'+lbl+'</span>'
    + arr.map(t => '<span class="tag" title="'+esc(t.d)+'">'+esc(t.k)+'</span>').join(''));
  wrap.appendChild(row('表', FLOWDATA.storage.tables));
  wrap.appendChild(row('事件', FLOWDATA.storage.events));
  return wrap;
}

function buildPresentation(){
  return el('div','tagrow','<span class="lbl">界面</span>'
    + FLOWDATA.presentation.map(p => '<span class="tag" title="'+esc(p.d)+'">'+esc(p.t)+'</span>').join(''));
}

function buildLog(){
  const wrap = el('div','log');
  FLOWDATA.changelog.forEach(c => {
    wrap.appendChild(el('div','log-item','<span class="date">'+esc(c.date)+'</span><span>'+esc(c.text)+'</span>'));
  });
  return wrap;
}

(function render(){
  document.getElementById('hdr-ver').textContent = FLOWDATA.meta.version;
  document.getElementById('hdr-meta').textContent = FLOWDATA.meta.updated + ' · ' + FLOWDATA.meta.line;

  const legend = document.getElementById('legend');
  Object.entries(KIND).forEach(([k,v]) => {
    legend.appendChild(el('span','lg','<i style="background:'+v.color+'"></i>'+esc(v.label)));
  });

  const app = document.getElementById('app');
  const sec = (no, title, p, body) => {
    const s = el('section','sec','<div class="sec-title"><span class="sec-no">'+no+'</span><div><h2>'+esc(title)+'</h2>'+(p?'<p>'+esc(p)+'</p>':'')+'</div></div>');
    s.appendChild(body);
    app.appendChild(s);
    return s;
  };

  sec('01','运行主线','从启动到呈现，一条线看懂（连线上的标签是节奏/边界信息）', buildMainline());
  sec('02','AI 引擎群','10 项能力 · 点击卡片展开细节（颜色=环节类型）', buildEngines());
  sec('03','双通道与安全边界','本地可读全库 · 云端只有 HTTP 代理 · 中间是脱敏铁律', buildChannels());
  sec('04','数据与事件','悬停查看用途', buildStorage());
  sec('05','呈现层','AI 能力的界面落点', buildPresentation());

  const logSec = sec('06','更新日志','每次迭代在最前面加一条', buildLog());
  const guide = el('details','block');
  guide.innerHTML = '<summary><span>📝 如何更新这张图</span><span class="more">▾</span></summary>'
    + '<div class="inner"><ol>'
    + '<li>打开本文件，编辑 <code>&lt;script&gt;</code> 里的 <code>FLOWDATA</code>（全图唯一数据源，布局自动生成）；</li>'
    + '<li>改 <code>meta.version / meta.updated</code>；主线改 <code>mainline</code>（<code>edge</code> 是连线标签）；</li>'
    + '<li>新增 AI 能力 → <code>engines</code> 数组追加卡片（icon / pc 主色 / name / tag / steps / out）；</li>'
    + '<li><code>changelog</code> 最前面加一条，刷新浏览器即生效。<b>文案从短：节点 ≤6 字、chips ≤6 字，长解释放 steps.d。</b></li>'
    + '</ol></div>';
  logSec.appendChild(guide);
})();
</script>
</body>
</html>
