<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CostHub 运行逻辑 · AI 能力流程图</title>
<style>
  :root{
    --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f1f5f9; --card:#ffffff;
    --primary:#2563eb; --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6;
  }
  .wrap{max-width:1240px; margin:0 auto; padding:24px 20px 60px;}

  /* ---------- 顶栏 ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    background:linear-gradient(120deg,#1e3a8a,#2563eb 55%,#3b82f6);
    color:#fff; border-radius:var(--radius); padding:22px 26px; box-shadow:0 10px 30px rgba(37,99,235,.25);
  }
  .topbar h1{font-size:24px; font-weight:700; letter-spacing:.5px;}
  .topbar .ver{background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.45); padding:2px 10px; border-radius:999px; font-size:14px; font-weight:600; margin-left:8px;}
  .topbar .sub{font-size:13px; opacity:.85; margin-top:4px;}
  .topbar-actions{display:flex; align-items:center; gap:12px;}
  .topbar-actions .updated{font-size:13px; opacity:.9; background:rgba(255,255,255,.15); padding:6px 12px; border-radius:8px;}
  .topbar button{
    background:#fff; color:#1d4ed8; border:none; padding:8px 16px; border-radius:10px;
    font-size:14px; font-weight:600; cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.15);
  }
  .topbar button:hover{transform:translateY(-1px);}

  /* ---------- 图例 ---------- */
  .legend{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:18px 0 6px;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:12px 16px;
  }
  .legend .l-title{font-size:13px; color:var(--muted); margin-right:4px; font-weight:600;}
  .lg{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; padding:4px 12px; border-radius:999px; border:1px solid var(--line); background:#f8fafc;}
  .lg i{width:10px; height:10px; border-radius:3px; display:inline-block;}

  /* ---------- 锚点导航 ---------- */
  .toc{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 6px;}
  .toc a{
    text-decoration:none; font-size:13px; color:#1d4ed8; background:#eff6ff; border:1px solid #bfdbfe;
    padding:5px 12px; border-radius:999px;
  }
  .toc a:hover{background:#dbeafe;}

  /* ---------- 章节 ---------- */
  .sec{margin-top:34px;}
  .sec-head{display:flex; align-items:baseline; gap:12px; margin-bottom:14px;}
  .sec-no{
    font-size:13px; font-weight:800; color:#fff; background:var(--primary); border-radius:8px;
    padding:3px 10px; letter-spacing:1px;
  }
  .sec-head h2{font-size:20px; font-weight:700;}
  .sec-head p{font-size:13px; color:var(--muted);}

  /* ---------- 主线（spine） ---------- */
  .spine{display:flex; flex-direction:column; align-items:stretch;}
  .spine-card{
    display:flex; gap:16px; background:var(--card); border:1px solid var(--line); border-left:5px solid var(--sc,#64748b);
    border-radius:var(--radius); padding:16px 20px; box-shadow:0 2px 8px rgba(15,23,42,.05);
  }
  .spine-card.kind-start{--sc:#16a34a; background:linear-gradient(90deg,#f0fdf4,#fff 40%);}
  .spine-card.kind-decision{--sc:#d97706; background:linear-gradient(90deg,#fffbeb,#fff 40%);}
  .spine-card.kind-process{--sc:#2563eb; background:linear-gradient(90deg,#eff6ff,#fff 40%);}
  .spine-card.kind-cloud{--sc:#dc2626; background:linear-gradient(90deg,#fef2f2,#fff 40%);}
  .spine-card.kind-data{--sc:#64748b;}
  .spine-card.kind-ui{--sc:#7c3aed; background:linear-gradient(90deg,#f5f3ff,#fff 40%);}
  .sc-icon{font-size:28px; line-height:1.2;}
  .sc-body{flex:1;}
  .sc-title{font-size:16px; font-weight:700; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .sc-file{font-size:12px; color:var(--muted); background:#f1f5f9; border:1px solid var(--line); padding:1px 8px; border-radius:6px; font-weight:400;}
  .sc-body ul{margin-top:6px; padding-left:20px;}
  .sc-body li{font-size:13.5px; color:#334155; margin-top:2px;}
  .branches{display:flex; gap:12px; margin-top:10px; flex-wrap:wrap;}
  .branch{
    flex:1; min-width:220px; border:1px dashed #fbbf24; background:#fffbeb; border-radius:10px; padding:8px 12px;
  }
  .branch-label{font-size:13px; font-weight:700; color:#b45309; display:block;}
  .branch-note{font-size:12.5px; color:#78350f; opacity:.85;}
  .arrow-v{display:flex; justify-content:center; padding:2px 0;}

  /* ---------- 调度器 ---------- */
  .sched-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:18px;}
  .sched-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:0 2px 8px rgba(15,23,42,.05);}
  .sched-head{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .sched-icon{font-size:22px;}
  .sched-name{font-size:15px; font-weight:700;}
  .sched-file{font-size:12px; color:var(--muted);}
  .badge{margin-left:auto; font-size:12px; background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe; padding:2px 10px; border-radius:999px; white-space:nowrap;}
  .sched-triggers{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:10px;}
  .lbl{font-size:12px; color:var(--muted); font-weight:700; margin-right:2px;}
  .trig{font-size:12px; background:#fffbeb; color:#92400e; border:1px solid #fde68a; padding:2px 9px; border-radius:999px;}
  .sched-steps{display:flex; flex-direction:column; gap:8px; margin-bottom:10px;}
  .sstep{display:flex; gap:10px; align-items:flex-start; background:#f8fafc; border:1px solid var(--line); border-radius:10px; padding:8px 12px;}
  .sstep .dot{width:10px; height:10px; border-radius:50%; margin-top:6px; flex-shrink:0;}
  .sstep-label{font-size:13.5px; font-weight:600;}
  .sstep-detail{font-size:12.5px; color:#475569; margin-top:1px;}
  .sched-out{font-size:13px; color:#334155; background:#f0fdf4; border:1px solid #bbf7d0; border-radius:10px; padding:8px 12px;}
  .sched-out .lbl{color:#15803d;}

  /* ---------- 子系统 ---------- */
  .sub-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(520px,1fr)); gap:18px;}
  .sub-card{background:var(--card); border:1px solid var(--line); border-top:4px solid var(--pc,#2563eb); border-radius:var(--radius); padding:16px 18px; box-shadow:0 2px 8px rgba(15,23,42,.05);}
  .sub-head{display:flex; gap:10px; align-items:flex-start; margin-bottom:8px;}
  .sub-icon{font-size:24px;}
  .sub-name{font-size:15.5px; font-weight:700;}
  .sub-file{font-size:12px; color:var(--muted);}
  .sub-summary{font-size:13px; color:#475569; margin:2px 0 10px;}
  .flow{display:flex; flex-wrap:wrap; gap:6px; align-items:stretch; margin-bottom:10px;}
  .chip{
    --c:#64748b; --bg:#f8fafc; --bd:#e2e8f0;
    background:var(--bg); border:1px solid var(--bd); border-left:4px solid var(--c);
    border-radius:10px; padding:7px 10px; min-width:110px; max-width:230px;
  }
  .chip-label{font-size:12.8px; font-weight:600; color:var(--ink);}
  .chip-detail{font-size:11.5px; color:var(--muted); margin-top:2px; line-height:1.45;}
  .flow-arrow{align-self:center; color:#94a3b8; font-size:16px; font-weight:700; flex-shrink:0;}
  .sub-out{font-size:12.8px; color:#334155; background:#f5f3ff; border:1px solid #ddd6fe; border-radius:10px; padding:7px 12px;}
  .sub-out b{color:#6d28d9;}

  /* ---------- 云端通道 ---------- */
  .channels{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  .chan{border-radius:var(--radius); padding:16px 18px; border:2px solid;}
  .chan.local{background:#eff6ff; border-color:#93c5fd;}
  .chan.cloud{background:#fef2f2; border-color:#fca5a5;}
  .chan h4{font-size:15px; font-weight:700; margin-bottom:6px;}
  .chan.local h4{color:#1d4ed8;} .chan.cloud h4{color:#b91c1c;}
  .chan ul{padding-left:18px;}
  .chan li{font-size:13px; color:#334155; margin-top:3px;}
  .wall{
    margin-top:14px; background:#0f172a; color:#e2e8f0; border-radius:var(--radius); padding:12px 18px;
    display:flex; gap:10px; align-items:flex-start; font-size:13px;
  }
  .wall b{color:#fbbf24;}
  .pipeline{display:flex; flex-wrap:wrap; gap:8px; align-items:stretch; margin-top:14px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px;}
  .pipeline .chip{flex:1; min-width:150px; max-width:none;}

  /* ---------- 数据与事件 ---------- */
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  .panel{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px;}
  .panel h4{font-size:14.5px; font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
  .kv{display:flex; flex-direction:column; gap:6px;}
  .kv .row{font-size:13px; display:flex; gap:8px; align-items:baseline;}
  .kv .k{font-family:Consolas, "Cascadia Code", monospace; font-size:12.3px; background:#f1f5f9; border:1px solid var(--line); border-radius:6px; padding:1px 7px; white-space:nowrap; color:#0f172a;}
  .kv .v{color:#475569;}
  .kv .row .arrow{color:#94a3b8;}

  /* ---------- 呈现 ---------- */
  .ui-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px;}
  .ui-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; box-shadow:0 2px 8px rgba(15,23,42,.05);}
  .ui-card h5{font-size:14px; font-weight:700; margin-bottom:6px;}
  .ui-card li{font-size:12.8px; color:#475569; margin-left:16px; margin-top:2px;}

  /* ---------- 更新日志 ---------- */
  .log-item{display:flex; gap:14px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:12px 16px; margin-top:10px;}
  .log-date{font-size:12.5px; font-weight:700; color:#1d4ed8; background:#eff6ff; border:1px solid #bfdbfe; border-radius:8px; padding:2px 10px; height:fit-content; white-space:nowrap;}
  .log-text{font-size:13.5px; color:#334155;}
  .guide{background:#fffbeb; border:1px solid #fde68a; border-radius:var(--radius); padding:16px 20px; margin-top:16px;}
  .guide h4{color:#92400e; font-size:15px; margin-bottom:8px;}
  .guide ol{padding-left:20px;}
  .guide li{font-size:13.5px; color:#78350f; margin-top:4px;}
  .guide code{background:#fff7ed; border:1px solid #fed7aa; border-radius:5px; padding:0 6px; font-size:12.5px;}

  footer{margin-top:30px; text-align:center; font-size:12px; color:var(--muted);}

  @media (max-width:900px){
    .channels, .two-col{grid-template-columns:1fr;}
    .sub-grid{grid-template-columns:1fr;}
  }
  @media print{
    body{background:#fff;}
    .no-print{display:none !important;}
    .spine-card, .sched-card, .sub-card, .chan, .panel, .ui-card, .log-item, .legend, .wall, .pipeline{break-inside:avoid; box-shadow:none;}
    .sec{break-inside:avoid-page;}
    .topbar{background:#1e3a8a !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="topbar">
    <div>
      <h1>CostHub 运行逻辑 · AI 能力流程图<span class="ver" id="hdr-ver">v2.3.19</span></h1>
      <div class="sub" id="hdr-sub">数据驱动流程图 —— 全部内容在文件内 FLOWDATA 数据中，工具迭代后改数据即可更新</div>
    </div>
    <div class="topbar-actions">
      <span class="updated" id="hdr-updated">更新：2026-08-16</span>
      <button onclick="window.print()">🖨 打印 / 导出 PDF</button>
    </div>
  </header>

  <div class="legend" id="legend"></div>

  <nav class="toc no-print" id="toc"></nav>

  <main id="app"></main>

  <footer>CostHub · 成本管理平台 · 本图与源码保持同步，由 FLOWDATA 数据驱动</footer>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════
   ★★★ 更新本流程图的方法（重要，工具每次迭代后按此更新） ★★★

   1. 本图 100% 由下方 FLOWDATA 数据驱动，页面布局与连线全部自动生成，
      更新时【只改数据，不要动渲染代码】。
   2. 新版本发布后：
      ① 改 meta.version（右上角版本号）与 meta.updated（更新时间）
      ② 新增/修改后台引擎 → 编辑 schedulers 数组
      ③ 新增/修改 AI 能力 → 编辑 subsystems 数组
      ④ 修改启动/主线/边界 → 编辑 spine / cloud / storage / presentation
      ⑤ 在 changelog 数组【最前面】追加一条记录
      ⑥ 刷新浏览器即生效
   3. 步骤的颜色分类见 KIND 常量；如需新类型，在 KIND 加一行即可。
   4. 每条数据的中文字段含义：
      label = 步骤名 ｜ detail = 步骤说明 ｜ kind = 颜色分类（local 本地AI / cloud 云端 /
      rule 本地规则 / data 数据 / ui 界面 / event 事件 / gate 闸门）
   ════════════════════════════════════════════════════════════════════ */

const FLOWDATA = {

  meta: {
    version: 'v2.3.19',
    updated: '2026-08-16',
    subtitle: '运行逻辑总览：启动 → 门禁 → 初始化 → 后台调度 → AI 引擎群（双通道）→ 落库留痕 → 呈现',
  },

  /* ─────────── ① 总体运行主线（自上而下） ─────────── */
  spine: [
    {
      icon: '🚀', kind: 'start', title: '应用启动', file: 'main.tsx → App.tsx',
      desc: [
        'Tauri 启动 → React 挂载，主题 / 缩放 / 低特效模式加载',
        '连接 SQLite（costhub.db，exe 同目录，Rust get_db_url 提供路径）',
        '首次运行初始化默认账号（admin / 666666，SHA-256 存 settings）',
      ],
    },
    {
      icon: '🔐', kind: 'decision', title: '登录门禁', file: 'LoginScreen.tsx + db.ts 数据锁',
      desc: [
        '用户名 + 密码校验（verifyPassword）；成本数据机密保护',
        '密码错误也允许进入 → 受限模式：查询返回空、写入静默跳过、顶部琥珀提示条（双保险防误以为数据丢失）',
      ],
      branches: [
        { label: '✅ 解锁进入', note: '数据全部可见、写入生效；解锁后同步模块库与 parts.projects 关联' },
        { label: '⚠️ 受限模式', note: '数据不可见、写入跳过；设置页仍可打开（改密码走 getRawDb 绕过锁）' },
      ],
    },
    {
      icon: '⚙️', kind: 'process', title: '初始化与数据准备',
      desc: [
        'ensureSchema 自动补齐缺失表/列（错误容忍：已存在时静默失败）',
        '解锁后：syncProjectModulesToLibrary / syncPartsProjectsField 历史数据修复',
        '首次 AI 能力引导（localStorage costhub-ai-guide-seen，只展示一次）',
      ],
    },
    {
      icon: '🔁', kind: 'process', title: '启动后台调度（App 级）',
      desc: [
        '三大引擎均「打开应用立即一轮 + 每 60 秒轮询」，各自独立防重入',
        '① 自主分析 runAutoAdvisor　② 报价比对 runAutoCompare　③ 关键物料洞察 runAutoInsight',
        'AI 状态条 30 秒自检 Ollama（127.0.0.1 优先，绕过公司代理直连铁律）',
        '任务进度统一广播 costhub-ai-task → 状态条实时显示“本地 AI 正在做什么”',
      ],
    },
    {
      icon: '🖱️', kind: 'process', title: '用户操作与事件触发',
      desc: [
        'Excel 导入 / 供应商改价 / BOM 增删改 → dispatch costhub-compare-request → 立即触发报价比对扫描',
        '打开驾驶舱 → 触发 AI 今日速览；打开项目页 → 触发一次报价比对',
        '对话与 👍/👎 反馈 → 学习引擎沉淀（关注主题统计 / 逻辑偏好规则）',
        'Ctrl+K 全局搜索、导航切换、数据维护等常规操作',
      ],
    },
    {
      icon: '🤖', kind: 'process', title: 'AI 引擎群（双通道架构）',
      desc: [
        '本地 Ollama 通道：可读本地库，承载 对话 / Agent / 润色 / 意图提取 / 总结',
        '云端通道：仅 agentSearchLoop 洞察链路，外发 = 脱敏白名单（物料通用名 / 品类 / 问题）',
        '所有 AI 调用 logLocalAICall 留痕 → ai_request_logs（含 token 用量统计）',
      ],
    },
    {
      icon: '🌐', kind: 'cloud', title: '云端洞察链路 agentSearchLoop', file: 'trendService.ts',
      desc: [
        '① DeepSeek 原生联网搜索优先（Responses API web_search，一轮“搜索+分析”，返回真实来源）',
        '② 失败 / 未启用 → Serper / Tavily / Bing 搜索 API，Skill 决定多轮迭代（maxSearchRounds）',
        '③ 无搜索 API → LLM 训练知识分析（明确标注时效性不足）',
        '输出归一化：方向-幅度一致性校验、超 ±30% 异常幅度拦截、时效分级（3月/6月）、反幻觉约束',
      ],
    },
    {
      icon: '💾', kind: 'data', title: '落库与留痕（SQLite）',
      desc: [
        'trend_items / trend_snapshots（洞察对象与历史批次）、part_insights（报价情报）',
        'ai_advisor_insights（自主建议）、ai_bridge_logs（桥洞察存档）、part_compare_cache / part_aliases',
        'ai_request_logs 全量 AI 审计 + token 用量；settings 存节流与开关配置',
      ],
    },
    {
      icon: '🖥️', kind: 'ui', title: '呈现层（UI 触点）',
      desc: [
        '驾驶舱：AI 状态条 + 今日速览 + 目标成本达成 + 自主建议 + 关键物料洞察（机会点置顶）',
        '项目页：AI 体检条 / 报价情报（未读 Badge）/ 模块头跨项目比对',
        '本地 AI 助手页：对话 / Agent 切换、执行轨迹卡、AI 活动记录、AI 学习档案',
        '物料趋势洞察页：快捷洞察区（含“自动”Tag）+ 洞察详情（历史时间轴 / 分 Skill / 追问）',
      ],
    },
  ],

  /* ─────────── ② 三大后台调度引擎（60 秒轮询详解） ─────────── */
  schedulers: [
    {
      icon: '⚙️', name: '自主分析引擎 runAutoAdvisor', file: 'src/autoAdvisor.ts', tag: '60s 轮询 + 启动立即一轮',
      triggers: ['打开应用立即一轮', '每 60 秒轮询（防重入）'],
      steps: [
        { label: '读取全量本地数据', detail: '项目 / BOM / 成本快照 / 物料 / 供应商 / 目标成本（全部本地，零外部调用）', kind: 'rule' },
        { label: '纯规则发现机会/风险', detail: 'buildRuleCandidates 四类：①项目成本≥60 天未变动 ②大额物料≥¥10 且≥90 天未调价 ③领域超目标≥5% ④大额物料单一供应商', kind: 'rule' },

/* ══════════════════════ 渲染层（一般无需修改） ══════════════════════ */
const KIND = {
  local:  { label: '本地 AI（Ollama，可读库）', color: '#2563eb', bg: '#eff6ff', bd: '#bfdbfe' },
  cloud:  { label: '云端（脱敏外发）',          color: '#dc2626', bg: '#fef2f2', bd: '#fecaca' },
  rule:   { label: '本地规则（免费）',          color: '#16a34a', bg: '#f0fdf4', bd: '#bbf7d0' },
  gate:   { label: '闸门 / 审计',               color: '#0d9488', bg: '#f0fdfa', bd: '#99f6e4' },
  data:   { label: '数据 / 存储',               color: '#64748b', bg: '#f8fafc', bd: '#e2e8f0' },
  ui:     { label: 'UI 呈现',                   color: '#7c3aed', bg: '#f5f3ff', bd: '#ddd6fe' },
  event:  { label: '事件 / 调度',               color: '#d97706', bg: '#fffbeb', bd: '#fde68a' },
};
const kindOf = k => KIND[k] || KIND.data;
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function el(tag, cls, html){ const d=document.createElement(tag); if(cls) d.className=cls; if(html!=null) d.innerHTML=html; return d; }
const arrowV = '<svg class="arrow-v" width="16" height="26" viewBox="0 0 16 26" aria-hidden="true"><line x1="8" y1="0" x2="8" y2="21" stroke="#94a3b8" stroke-width="2"/><polyline points="2.5,16.5 8,22.5 13.5,16.5" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const arrowR = '<span class="flow-arrow">→</span>';
function chip(st){
  const k = kindOf(st.kind);
  return '<div class="chip" style="--c:'+k.color+';--bg:'+k.bg+';--bd:'+k.bd+'">'
    + '<div class="chip-label">'+esc(st.label)+'</div>'
    + (st.detail ? '<div class="chip-detail">'+esc(st.detail)+'</div>' : '')
    + '</div>';
}

/* ① 主线 */
function buildSpine(){
  const wrap = el('div','spine');
  FLOWDATA.spine.forEach((it, i) => {
    const card = el('div','spine-card kind-'+it.kind, [
      '<div class="sc-icon">'+it.icon+'</div>',
      '<div class="sc-body">',
        '<div class="sc-title">'+esc(it.title)+(it.file?'<span class="sc-file">'+esc(it.file)+'</span>':'')+'</div>',
        '<ul>'+it.desc.map(d=>'<li>'+esc(d)+'</li>').join('')+'</ul>',
        it.branches ? '<div class="branches">'+it.branches.map(b=>
          '<div class="branch"><span class="branch-label">'+esc(b.label)+'</span><span class="branch-note">'+esc(b.note)+'</span></div>'
        ).join('')+'</div>' : '',
      '</div>',
    ].join(''));
    wrap.appendChild(card);
    if (i < FLOWDATA.spine.length - 1) wrap.appendChild(el('div','arrow-v-wrap', arrowV));
  });
  return wrap;
}

/* ② 调度引擎 */
function buildSchedulers(){
  const grid = el('div','sched-grid');
  FLOWDATA.schedulers.forEach(sc => {
    const card = el('div','sched-card', [
      '<div class="sched-head"><span class="sched-icon">'+sc.icon+'</span>',
        '<div><div class="sched-name">'+esc(sc.name)+'</div><div class="sched-file">'+esc(sc.file)+'</div></div>',
        '<span class="badge">'+esc(sc.tag)+'</span></div>',
      '<div class="sched-triggers"><span class="lbl">触发</span>'+sc.triggers.map(t=>'<span class="trig">'+esc(t)+'</span>').join('')+'</div>',
      '<div class="sched-steps">'+sc.steps.map(s=>
        '<div class="sstep"><span class="dot" style="background:'+kindOf(s.kind).color+'"></span><div>'
        +'<div class="sstep-label">'+esc(s.label)+'</div><div class="sstep-detail">'+esc(s.detail)+'</div></div></div>'
      ).join('')+'</div>',
      '<div class="sched-out"><span class="lbl">输出</span>'+esc(sc.outputs)+'</div>',
    ].join(''));
    grid.appendChild(card);
  });
  return grid;
}

/* ③ AI 能力全景 */
function buildSubsystems(){
  const grid = el('div','sub-grid');
  FLOWDATA.subsystems.forEach(ss => {
    const flow = ss.steps.map(chip).join(arrowR);
    const card = el('div','sub-card', [
      '<div class="sub-head"><span class="sub-icon">'+ss.icon+'</span><div>',
        '<div class="sub-name">'+esc(ss.name)+'</div><div class="sub-file">'+esc(ss.file)+'</div></div></div>',
      '<div class="sub-summary">'+esc(ss.summary)+'</div>',
      '<div class="flow">'+flow+'</div>',
      '<div class="sub-out">'+ss.outputs+'</div>',
    ].join(''));
    card.style.setProperty('--pc', ss.pc || '#2563eb');
    grid.appendChild(card);
  });
  return grid;
}

/* ④ 云端与安全边界 */
function buildCloud(){
  const wrap = el('div');
  const chans = el('div','channels');
  FLOWDATA.cloud.channels.forEach(c => {
    chans.appendChild(el('div','chan '+c.cls, '<h4>'+esc(c.title)+'</h4><ul>'+c.items.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul>'));
  });
  wrap.appendChild(chans);
  wrap.appendChild(el('div','wall', esc(FLOWDATA.cloud.wall).replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')));
  const pipe = el('div','pipeline');
  FLOWDATA.cloud.pipeline.forEach((s,i)=>{ pipe.appendChild(el('div',null,chip(s))); if(i<FLOWDATA.cloud.pipeline.length-1) pipe.appendChild(el('div',null,arrowR)); });
  wrap.appendChild(pipe);
  return wrap;
}

/* ⑤ 数据与事件 */
function buildStorage(){
  const two = el('div','two-col');
  const t = el('div','panel','<h4>🗄 核心数据表（SQLite）</h4><div class="kv">'
    + FLOWDATA.storage.tables.map(r=>'<div class="row"><span class="k">'+esc(r.k)+'</span><span class="v">'+esc(r.v)+'</span></div>').join('')+'</div>');
  const e = el('div','panel','<h4>📡 全局事件（window CustomEvent）</h4><div class="kv">'
    + FLOWDATA.storage.events.map(r=>'<div class="row"><span class="k">'+esc(r.k)+'</span><span class="arrow">→</span><span class="v">'+esc(r.v)+'</span></div>').join('')+'</div>');
  two.appendChild(t); two.appendChild(e);
  return two;
}

/* ⑥ 呈现层 */
function buildPresentation(){
  const grid = el('div','ui-grid');
  FLOWDATA.presentation.forEach(p => {
    grid.appendChild(el('div','ui-card','<h5>'+p.icon+' '+esc(p.title)+'</h5><ul>'+p.items.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul>'));
  });
  return grid;
}

/* ⑦ 更新日志 + 维护指南 */
function buildChangelog(){
  const wrap = el('div');
  FLOWDATA.changelog.forEach(c => {
    wrap.appendChild(el('div','log-item','<span class="log-date">'+esc(c.date)+'</span><span class="log-text">'+esc(c.text)+'</span>'));
  });
  wrap.appendChild(el('div','guide', [
    '<h4>📝 如何更新这张流程图（工具每次迭代后）</h4><ol>',
    '<li>打开本文件，找到 <code>&lt;script&gt;</code> 中的 <code>FLOWDATA</code> —— 全图内容的数据源，布局与连线自动生成，<b>只改数据即可</b>；</li>',
    '<li>新版本：改 <code>meta.version</code> 与 <code>meta.updated</code>；</li>',
    '<li>新增后台引擎 → 在 <code>schedulers</code> 数组追加对象（icon / name / triggers / steps / outputs）；</li>',
    '<li>新增 AI 能力 → 在 <code>subsystems</code> 数组追加对象（icon / pc 主色 / name / summary / steps / outputs）；</li>',
    '<li>主线 / 云端边界 / 数据表 / 呈现层分别改 <code>spine</code> / <code>cloud</code> / <code>storage</code> / <code>presentation</code>；</li>',
    '<li>在 <code>changelog</code> 数组<b>最前面</b>追加一条 {date, text}，刷新浏览器即生效。</li>',
    '</ol>',
  ].join('')));
  return wrap;
}

/* 组装 */
(function render(){
  document.getElementById('hdr-ver').textContent = FLOWDATA.meta.version;
  document.getElementById('hdr-updated').textContent = '更新：' + FLOWDATA.meta.updated;
  document.getElementById('hdr-sub').textContent = FLOWDATA.meta.subtitle;

  const legend = document.getElementById('legend');
  legend.appendChild(el('span','l-title','图例'));
  Object.entries(KIND).forEach(([k, v]) => {
    legend.appendChild(el('span','lg','<i style="background:'+v.color+'"></i>'+esc(v.label)));
  });

  const toc = document.getElementById('toc');
  const anchors = [
    ['sec-spine','① 总体运行主线'], ['sec-sched','② 后台调度引擎'], ['sec-sub','③ AI 能力全景'],
    ['sec-cloud','④ 云端通道与安全边界'], ['sec-storage','⑤ 数据与事件'], ['sec-ui','⑥ 呈现层'], ['sec-log','⑦ 更新日志'],
  ];
  anchors.forEach(([id, t]) => { const a = el('a', null, t); a.href = '#' + id; toc.appendChild(a); });

  const app = document.getElementById('app');
  const mkSec = (no, id, title, p, body) => {
    const s = el('section','sec', '<div class="sec-head"><span class="sec-no">'+no+'</span><div><h2>'+title+'</h2><p>'+esc(p)+'</p></div></div>');
    s.id = id;
    s.appendChild(body);
    app.appendChild(s);
  };
  mkSec('01','sec-spine','总体运行主线','从启动到呈现的完整链路（含登录门禁分支与受限模式）', buildSpine());
  mkSec('02','sec-sched','后台调度引擎（60 秒轮询 ×3）','打开应用立即一轮 + 每 60 秒轮询；规则免费、AI 节流、失败静默', buildSchedulers());
  mkSec('03','sec-sub','AI 能力全景','每个子系统为一条独立流程：本地 AI / 云端 / 规则 / 闸门按颜色区分', buildSubsystems());
  mkSec('04','sec-cloud','云端通道与安全边界','双通道架构：本地可读库、云端只有 HTTP 代理；脱敏铁律与发送前审计', buildCloud());
  mkSec('05','sec-storage','数据与事件','SQLite 表与全局事件，AI 全链路留痕可审计', buildStorage());
  mkSec('06','sec-ui','呈现层（UI 触点）','AI 能力在界面上的落点', buildPresentation());
  mkSec('07','sec-log','更新日志与维护指南','每次工具迭代在此追加记录；更新方法见底部指南', buildChangelog());
})();
