<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>趋势数据调试</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #f5f5f5; }
    .section { background: white; padding: 15px; margin: 10px 0; border-radius: 8px; }
    h2 { color: #333; border-bottom: 2px solid #1890ff; padding-bottom: 10px; }
    table { width: 100%; border-collapse: collapse; margin: 10px 0; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #1890ff; color: white; }
    .highlight { background: #fffbe6; font-weight: bold; }
    .error { color: red; }
    .success { color: green; }
  </style>
</head>
<body>
  <h1>🔍 趋势数据调试工具</h1>

  <div class="section">
    <h2>1. 检查数据库中 trend_enabled=1 的器件</h2>
    <div id="parts-check"></div>
  </div>

  <div class="section">
    <h2>2. 检查 trend_items 表</h2>
    <div id="items-check"></div>
  </div>

  <div class="section">
    <h2>3. 检查特定器件："外箱27寸五层"</h2>
    <div id="specific-check"></div>
  </div>

  <script type="module">
    import Database from 'tauri-plugin-sql-api';

    async function checkData() {
      try {
        const db = await Database.load('sqlite:costhub.db');

        // 1. 检查所有开启趋势关注的器件
        const parts = await db.select('SELECT id, name, model, sub_category, trend_enabled, trend_query_category, trend_category_type FROM parts WHERE trend_enabled = 1');

        let partsHtml = `<p>找到 <strong>${parts.length}</strong> 个开启了趋势关注的器件：</p><table>
          <tr><th>ID</th><th>器件名称</th><th>子类</th><th>trend_query_category</th><th>trend_category_type</th></tr>`;

        for (const p of parts) {
          const highlight = p.name.includes('外箱') ? ' class="highlight"' : '';
          partsHtml += `<tr${highlight}>
            <td>${p.id}</td>
            <td>${p.name}</td>
            <td>${p.sub_category || '-'}</td>
            <td><strong>${p.trend_query_category || '(空)'}</strong></td>
            <td>${p.trend_category_type || '-'}</td>
          </tr>`;
        }
        partsHtml += '</table>';
        document.getElementById('parts-check').innerHTML = partsHtml;

        // 2. 检查 trend_items 表
        const items = await db.select('SELECT * FROM trend_items ORDER BY id DESC LIMIT 20');
        let itemsHtml = `<p>最近的 ${items.length} 条趋势条目：</p><table>
          <tr><th>ID</th><th>query_category</th><th>category_type</th><th>trend_direction</th><th>更新时间</th></tr>`;

        for (const item of items) {
          const highlight = item.query_category === '瓦楞纸' ? ' class="highlight"' : '';
          itemsHtml += `<tr${highlight}>
            <td>${item.id}</td>
            <td><strong>${item.query_category}</strong></td>
            <td>${item.category_type}</td>
            <td>${item.trend_direction || '-'}</td>
            <td>${item.last_updated_at || '-'}</td>
          </tr>`;
        }
        itemsHtml += '</table>';
        document.getElementById('items-check').innerHTML = itemsHtml;

        // 3. 检查特定器件
        const specific = await db.select("SELECT * FROM parts WHERE name LIKE '%外箱%' OR name LIKE '%27寸%'");
        let specificHtml = '';

        if (specific.length === 0) {
          specificHtml = '<p class="error">❌ 未找到包含"外箱"或"27寸"的器件</p>';
        } else {
          specificHtml = `<p class="success">✅ 找到 ${specific.length} 个相关器件：</p><table>
            <tr><th>ID</th><th>名称</th><th>型号</th><th>子类</th><th>趋势开启</th><th>trend_query_category</th><th>trend_category_type</th></tr>`;

          for (const p of specific) {
            specificHtml += `<tr>
              <td>${p.id}</td>
              <td><strong>${p.name}</strong></td>
              <td>${p.model || '-'}</td>
              <td>${p.sub_category || '-'}</td>
              <td>${p.trend_enabled === 1 ? '✅ 是' : '❌ 否'}</td>
              <td class="highlight">${p.trend_query_category || '(空值)'}</td>
              <td>${p.trend_category_type || '(空值)'}</td>
            </tr>`;
          }
          specificHtml += '</table>';
        }
        document.getElementById('specific-check').innerHTML = specificHtml;

      } catch (e) {
        document.body.innerHTML += `<div class="section error"><h2>错误</h2><pre>${e.message}</pre></div>`;
      }
    }

    checkData();
  </script>
</body>
</html>
